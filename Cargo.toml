[package]
name = "restman-rs"
version = "0.1.0"
edition = "2024"

[features]
ureq = ["dep:ureq"]
reqwest = ["dep:reqwest", "dep:bytes"]
all-backends = ["ureq", "reqwest"]

[dependencies]
http = "1.4.0"
thiserror = "2.0.17"
serde = { version = "1.0.228", features = ["serde_derive"] }
serde_json = "1.0.145"
serde_url_params = "0.2.1"
ureq = { version = "3.1.4", features = ["cookies"], optional = true }
paste = "1.0.15"
futures = "0.3.32"
reqwest = { version = "0.13.4", optional = true, features = ["cookies", "json"] }
bytes = {version = "1.11.1", optional = true}
